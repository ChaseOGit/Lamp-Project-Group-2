<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Contact Manager</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body onload="loadDashboard()">

    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <div class="orb orb-4"></div>

    <!-- Main Dashboard Container -->
    <div class="dashboard-container fade-in">
        
        <!-- Top Navigation -->
        <header class="dash-header">
            <h2>My Contacts</h2>
            <div class="user-controls">
                <span id="userGreeting">Welcome back!</span>
                <!-- Log out triggers doLogout() in app.js -->
                <button id="logoutBtn" class="outline-btn" onclick="doLogout()">Log Out</button>
            </div>
        </header>

        <!-- Search and Add Toolbar -->
        <div class="toolbar">
            <div class="search-box input-group">
                <!-- onkeyup triggers a new search every time a key is pressed -->
                <input type="text" id="searchInput" placeholder="Search contacts..." onkeyup="searchContacts()">
            </div>
            <button id="addContactBtn" class="primary-btn add-btn" onclick="openModal()">+ Add Contact</button>
        </div>

        <!-- Contacts Grid -->
        <div class="contacts-scroll-area">
            <div class="contacts-grid" id="contactsGrid">
                
            </div>
        </div>
    </div>

    <!-- Add Contact Modal  -->
    <div class="modal-overlay" id="contactModal" style="display: none;">
        <div class="glass-container modal-content">
            <h2 id="modalTitle">Add New Contact</h2>
            
            <!--  preventDefault() stops the browser from refreshing the page on submit -->
            <form id="contactForm" onsubmit="event.preventDefault(); addContact();">
                
                
                <div class="input-group">
                    <input type="text" id="c_name" placeholder="Full Name" required>
                </div>
                <div class="input-group">
                    <input type="text" id="phone" placeholder="Phone Number">
                </div>
                <div class="input-group">
                    <input type="email" id="email" placeholder="Email Address">
                </div>
                <div class="modal-buttons">
                    <button type="button" id="closeModalBtn" class="outline-btn" onclick="closeModal()">Cancel</button>
                    <button type="submit" class="primary-btn">Save Contact</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/app.js"></script>

    <script>
        function openModal() {
            // Displays the modal overlay
            document.getElementById('contactModal').style.display = 'flex'; // 'flex' helps center it if you used flexbox in CSS
        }

        function closeModal() {
            // Hides the modal overlay
            document.getElementById('contactModal').style.display = 'none';
            document.getElementById('contactForm').reset(); 
        }
    </script>
</body>
</html>
